<!DOCTYPE html>
<html>
<head>
  <!--
    One build, two homes:
      * Discord proxy  https://<app>.discordsays.com/           (mapping '/' -> anthonyraad.github.io/Irodoku/discord)
      * GitHub Pages   https://anthonyraad.github.io/Irodoku/discord/
    Flutter resolves every asset against document.baseURI, so pick the base
    at load time instead of baking one in with --base-href.
  -->
  <script>
    (function () {
      var p = location.pathname, m = p.match(/^(.*\/discord\/)/);
      var base = m ? m[1] : '/';
      document.write('<base href="' + base + '">');
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pocket Daily Iro</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <style>html,body{margin:0;height:100%;width:100%;overflow:hidden;background:#111}</style>
</head>
<body>
  <!-- Bundled locally: Discord's CSP blocks outside origins. -->
  <script src="discord-sdk.js"></script>
  <script src="discord_bridge.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
