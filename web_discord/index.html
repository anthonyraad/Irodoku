<!DOCTYPE html>
<html>
<head>
  <!--
    One build, two homes:
      * Discord proxy  https://<app>.discordsays.com/           (mapping '/' -> anthonyraad.github.io/Irodoku/discord)
      * GitHub Pages   https://anthonyraad.github.io/Irodoku/discord/
    Flutter resolves every asset against document.baseURI, so pick the base
    at load time instead of baking one in with --base-href.
  -->
  <script>
    (function () {
      var p = location.pathname, m = p.match(/^(.*\/discord\/)/);
      var base = m ? m[1] : '/';
      document.write('<base href="' + base + '">');
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pocket Daily Iro</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <style>html,body{margin:0;height:100%;width:100%;overflow:hidden;background:#111}</style>
</head>
<body>
  <!-- Bundled locally: Discord's CSP blocks outside origins. -->
  <script>
    // Drop any service worker / Cache Storage left by older builds so Discord
    // never serves a stale main.dart.js.
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations()
      .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
    if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
  </script>
  <script>
    // Sound: audioplayers routes every <audio> through a WebAudio AudioContext.
    // Contexts created before a user gesture start "suspended" (Chrome/Discord
    // desktop, iOS/Android webviews), so the Activity was silent. Track every
    // context and resume them all on each user gesture.
    (function () {
      var Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return;
      var ctxs = [];
      function Tracked(o) { var c = new Ctor(o); ctxs.push(c); if (unlocked) c.resume(); return c; }
      Tracked.prototype = Ctor.prototype;
      window.AudioContext = Tracked; window.webkitAudioContext = Tracked;
      var unlocked = false;
      function unlock() {
        unlocked = true;
        ctxs.forEach(function (c) { if (c.state !== 'running') c.resume().catch(function () {}); });
      }
      ['pointerdown', 'touchend', 'mousedown', 'keydown'].forEach(function (e) {
        window.addEventListener(e, unlock, { capture: true, passive: true });
      });
    })();
  </script>
  <script src="discord-sdk.js"></script>
  <script src="discord_bridge.js"></script>
  <script src="flutter_bootstrap.js?v=__BUILD__" async></script>
</body>
</html>
