name: irodoku
description: A color-based Sudoku puzzle game.
publish_to: 'none'
version: 1.0.21+26

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  shared_preferences: ^2.5.5
  audioplayers: ^6.7.1
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  firebase_database: ^12.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  shaders:
    - shaders/organic_swatch.frag

  assets:
    - assets/icons/
    - assets/icon/
    - assets/sounds/
    - assets/sudoku/master_boards.bin

  fonts:
    - family: Balatro
      fonts:
        - asset: assets/fonts/balatro.ttf

