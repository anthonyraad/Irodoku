name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href="/Irodoku/"
      # Discord Activity (Pocket Daily Iro) -> /Irodoku/discord/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bash web_discord/build.sh build/web/discord
      # [Graffiti] Discord Activity (separate Discord app) -> /Irodoku/discord-graffiti/
      - run: bash web_discord_graffiti/build.sh build/web/discord-graffiti
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
