name = "irodoku-discord"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Nightly Pocket top-10 at 00:00 UTC-8 (fixed PST, matches DailyIrodoku).
[triggers]
# 16:00 UTC = 8 AM PST "Daily Iro is now live" post.
crons = ["0 8 * * *", "0 16 * * *"]

[vars]
DISCORD_CLIENT_ID = "1565967052047388822"
# RTDB root, e.g. https://<project>-default-rtdb.firebaseio.com
FIREBASE_DATABASE_URL = "https://word-multiplayer-default-rtdb.firebaseio.com"
# "embed" (Discord embed table; ~1 ms CPU, safe on Workers Free's 10 ms cap)
# or "png" (resvg-wasm image; ~9 ms warm / ~45 ms cold CPU measured, so it
# can exceed the Free cap -- use on Workers Paid). PNG errors fall back to embed.
NIGHTLY_FORMAT = "embed"
# Direct Activity launch link (Discord format: https://discord.com/activities/<app_id>).
ACTIVITY_LINK = "https://discord.com/activities/1565967052047388822"
# Interactions endpoint signature key (public; from the Developer Portal).
DISCORD_PUBLIC_KEY = "b1a7cdd789828b9c22b28ebfe8956b385f3857f5034698f040eeaedc31e7e266"
# #dire-dire-docks: single daily status message (needs secret DISCORD_BOT_TOKEN).
DISCORD_CHANNEL_ID = "1552500217524523118"

# Secrets (wrangler secret put ...): DISCORD_CLIENT_SECRET, DISCORD_BOT_TOKEN (optional; enables bot mode), DISCORD_WEBHOOK_URL,
# FIREBASE_SERVICE_ACCOUNT (service-account JSON),
# LINK_STATE_SECRET (random string, e.g. `openssl rand -base64 32`; HMAC key for Android
# 'Sync Discord' OAuth state on /link/*). Local dev: .dev.vars
# Optional var FIREBASE_PROJECT_ID (default word-multiplayer) = ID token aud/iss check.

[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true
